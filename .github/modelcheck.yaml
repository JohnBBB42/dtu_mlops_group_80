name: Model Artifact Check

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  check-model-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install wandb

      - name: Check for new model artifacts
        id: check_artifacts
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
        run: |
          python - <<EOF
          import os
          import wandb
          from datetime import datetime, timedelta

          # Initialize wandb API
          api = wandb.Api()

          # Get the list of artifacts
          artifacts = api.artifacts(
              f"{os.getenv('WANDB_ENTITY')}/{os.getenv('WANDB_PROJECT')}",
              per_page=100
          )

          # Check for new or updated artifacts
          new_artifact_found = False
          for artifact in artifacts:
              if artifact.type == 'model' and artifact.updated_at > artifact.created_at:
                  new_artifact_found = True
                  artifact_name = artifact.name
                  artifact_updated_at = artifact.updated_at.strftime('%Y-%m-%d %H:%M:%S UTC')
                  break

          # Using the new GitHub Actions output syntax
          if new_artifact_found:
              print(f"new_artifact=true" >> "$GITHUB_OUTPUT")
              print(f"artifact_name={artifact_name}" >> "$GITHUB_OUTPUT")
              print(f"artifact_updated_at={artifact_updated_at}" >> "$GITHUB_OUTPUT")
          else:
              print(f"new_artifact=false" >> "$GITHUB_OUTPUT")
          EOF

      - name: Create issue if new artifact found
        if: steps.check_artifacts.outputs.new_artifact == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.name,
              title: `New Model Artifact: ${process.env.ARTIFACT_NAME}`,
              body: `A new model artifact has been detected.\n\n**Artifact Name:** ${process.env.ARTIFACT_NAME}\n**Updated At:** ${process.env.ARTIFACT_UPDATED_AT}\n\nPlease review the changes.`
            })
        env:
          ARTIFACT_NAME: ${{ steps.check_artifacts.outputs.artifact_name }}
          ARTIFACT_UPDATED_AT: ${{ steps.check_artifacts.outputs.artifact_updated_at }}