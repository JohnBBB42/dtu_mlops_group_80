name: Model Artifact Check

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight
  workflow_dispatch:  # Allows manual triggering

jobs:
  check-model-artifacts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install wandb

      - name: Check for new model artifacts
        id: check_artifacts
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ secrets.WANDB_PROJECT }}
        run: |
          python - <<EOF
          import os
          import wandb

          # Initialize wandb API
          api = wandb.Api()

          # Get the list of artifacts
          artifacts = api.artifacts(type='model', project=os.getenv('WANDB_PROJECT'))

          # Check for new or updated artifacts
          new_artifact_found = False
          for artifact in artifacts:
              if artifact.updated_at > artifact.created_at:
                  new_artifact_found = True
                  artifact_name = artifact.name
                  artifact_updated_at = artifact.updated_at
                  break

          if new_artifact_found:
              print(f"::set-output name=new_artifact::true")
              print(f"::set-output name=artifact_name::{artifact_name}")
              print(f"::set-output name=artifact_updated_at::{artifact_updated_at}")
          else:
              print(f"::set-output name=new_artifact::false")
          EOF

      - name: Create issue if new artifact found
        if: steps.check_artifacts.outputs.new_artifact == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.name,
              title: `New Model Artifact: ${steps.check_artifacts.outputs.artifact_name}`,
              body: `A new model artifact has been detected.\n\n**Artifact Name:** ${steps.check_artifacts.outputs.artifact_name}\n**Updated At:** ${steps.check_artifacts.outputs.artifact_updated_at}\n\nPlease review the changes.`
            })